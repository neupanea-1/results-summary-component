<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div class="main">
    <div class="card">
      <div class="first">
        <p id="p1">Your Result</p>
        <div class="per"><b class="dta1">76</b><br>of 100</div>
        <h3>Great</h3>
        <p> You scored higher than 65% of the people who have taken these tests.</p>
      </div>
      <div class="second">
        <h3>Summary</h3>
        <div class="first-data rea">
          <div class="icon"><img src="/assets/images/icon-reaction.svg" alt=""></div>
          <div class="topic1">Reaction</div>
          <div class="score"><b class="dta">80</b>/100</div>
        </div>
        <div class="first-data mem">
          <div class="icon"><img src="/assets/images/icon-memory.svg" alt=""></div>
          <div class="topic2">Memory</div>
          <div class="score"><b class="dta">92</b>/100</div>
        </div>
        <div class="first-data ver">
          <div class="icon"><img src="/assets/images/icon-verbal.svg" alt=""></div>
          <div class="topic3">Verbal</div>
          <div class="score"><b class="dta">61</b>/100</div>
        </div>
        <div class="first-data vis">
          <div class="icon"><img src="/assets/images/icon-visual.svg" alt=""></div>
          <div class="topic4">Visual</div>
          <div class="score"><b class="dta">72</b>/100</div>
        </div>
        <div class="button">
          <input type="button" name="continue" value="Continue" id="btn">
        </div>
      </div>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Anish Neupane</a>.
  </footer>
</body>
</html>
